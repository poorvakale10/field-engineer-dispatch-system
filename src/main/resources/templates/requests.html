<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DispatchFlow | Requests</title><link rel="stylesheet" href="/css/app.css"></head>
<body><div class="app-shell"><aside class="sidebar"><div class="brand"><div class="brand-mark">DF</div>Dispatch<span>Flow</span></div><nav><a href="/">⌂ &nbsp;Dashboard</a><a class="active" href="/requests">▤ &nbsp;Service Requests</a><a href="/requests/new">＋ &nbsp;New Dispatch</a></nav></aside>
<main class="main"><header class="topbar"><div><div class="eyebrow">FIELD OPERATIONS</div><h1>Service requests</h1><p class="muted">Search, review and update dispatch records.</p></div><a class="btn btn-primary" href="/requests/new">＋ New dispatch</a></header>
<div class="panel"><div class="search-row"><form action="/requests" method="get"><input id="search" name="q" th:value="${q}" placeholder="Search customer, location or status..."><button class="btn btn-secondary" type="submit">Search</button></form></div><div class="table-wrap"><table><thead><tr><th>ID</th><th>Customer</th><th>Location</th><th>Issue</th><th>Priority</th><th>Engineer</th><th>Status</th><th></th></tr></thead><tbody><tr th:each="r:${requests}"><td class="id" th:text="'FE-'+${r.id}">FE-1</td><td><b th:text="${r.customerName}">Aarav</b></td><td th:text="${r.location}">Mumbai</td><td th:text="${r.issue}">Issue</td><td><span class="priority" th:classappend="${#strings.toLowerCase(r.priority)}" th:text="${r.priority}">HIGH</span></td><td th:text="${r.engineer==''?'Unassigned':r.engineer}">Amit</td><td><span class="status" th:classappend="${#strings.toLowerCase(r.status)}" th:text="${r.status.replace('_',' ')}">ASSIGNED</span></td><td><a class="icon-link" th:href="@{'/requests/'+${r.id}+'/edit'}">Edit</a></td></tr></tbody></table></div></div></main></div></body></html>
